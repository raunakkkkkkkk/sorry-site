<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffd7e8" />
  <title>Apology Responses Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">
  <div class="ambient-bg" aria-hidden="true">
    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>
    <div id="particles"></div>
  </div>

  <main class="admin-shell">
    <section id="loginCard" class="admin-login glass-card">
      <p class="eyebrow">Hidden page</p>
      <h1 class="font-['Pacifico'] text-5xl leading-tight">Admin View</h1>
      <p class="mt-3 text-[color:var(--muted)]">Enter the simple password to see selected responses.</p>
      <form id="adminLoginForm">
        <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" />
        <button class="primary-btn" type="submit">Unlock</button>
      </form>
      <p id="loginError" class="mt-3 font-bold text-pink-700 hidden">Wrong password. Try again softly.</p>
    </section>

    <section id="adminPanel" class="admin-panel glass-card hidden">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="eyebrow">Saved responses</p>
          <h1 class="font-['Pacifico'] text-5xl leading-tight">Her Choices</h1>
          <p id="adminStatus" class="mt-3 text-[color:var(--muted)]">Loading...</p>
        </div>
        <div class="admin-actions">
          <button id="refreshResponses" class="soft-btn" type="button">Refresh</button>
          <button id="clearResponses" class="outline-btn" type="button">Clear</button>
        </div>
      </div>
      <p id="emptyResponses" class="mt-8 text-[color:var(--muted)]">No responses yet. Pick a punishment on the main page, then refresh.</p>
      <div id="responseList" class="response-list"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module">
    import { clearAdminResponses, renderAdminResponses } from "./script.js";

    // Change this simple password before sharing the site.
    const ADMIN_PASSWORD = "love123";

    const loginCard = document.getElementById("loginCard");
    const adminPanel = document.getElementById("adminPanel");
    const loginError = document.getElementById("loginError");
    const responseList = document.getElementById("responseList");
    const emptyResponses = document.getElementById("emptyResponses");
    const adminStatus = document.getElementById("adminStatus");

    createAdminParticles();

    document.getElementById("adminLoginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("adminPassword").value;

      if (password !== ADMIN_PASSWORD) {
        loginError.classList.remove("hidden");
        gsap.fromTo(loginCard, { x: -8 }, { x: 0, duration: 0.35, ease: "elastic.out(1, 0.4)" });
        return;
      }

      loginCard.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      await loadResponses();
    });

    document.getElementById("refreshResponses").addEventListener("click", loadResponses);
    document.getElementById("clearResponses").addEventListener("click", async () => {
      const confirmed = confirm("Clear all saved responses?");
      if (!confirmed) return;

      await clearAdminResponses({
        listEl: responseList,
        emptyEl: emptyResponses,
        statusEl: adminStatus
      });
    });

    async function loadResponses() {
      await renderAdminResponses({
        listEl: responseList,
        emptyEl: emptyResponses,
        statusEl: adminStatus
      });
    }

    function createAdminParticles() {
      const container = document.getElementById("particles");
      for (let index = 0; index < 34; index += 1) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * -9}s`;
        particle.style.setProperty("--duration", `${7 + Math.random() * 8}s`);
        particle.style.setProperty("--sway", `${-35 + Math.random() * 70}px`);
        container.appendChild(particle);
      }
    }
  </script>
</body>
</html>
